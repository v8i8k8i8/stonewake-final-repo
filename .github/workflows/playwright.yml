name: Playwright Tests

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch. Queued runs are not cancelled: each run is evidence for the five-run check.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      # Repository secrets (Settings > Secrets and variables > Actions). Never commit the values.
      STONEWAKE_EMAIL: ${{ secrets.STONEWAKE_EMAIL }}
      STONEWAKE_PASSWORD: ${{ secrets.STONEWAKE_PASSWORD }}
      STONEWAKE_API_KEY: ${{ secrets.STONEWAKE_API_KEY }}
    steps:
      # Action versions as validated in the preparation kit (2026-11-03).
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (retries disabled)
        id: tests
        shell: bash
        run: npx playwright test --retries=0 2>&1 | tee playwright-console.log; exit ${PIPESTATUS[0]}

      - name: Write build info into the report
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p playwright-report
          cat > playwright-report/build-info.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "runId": "${{ github.run_id }}",
            "runAttempt": "${{ github.run_attempt }}",
            "runUrl": "${RUN_URL}",
            "event": "${{ github.event_name }}",
            "testOutcome": "${TEST_OUTCOME}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat playwright-report/build-info.json

      # Reports and traces of a FAILED run can contain what was typed into the login form
      # (docs/ENGINEERING_DECISIONS.md, ED-02), so they are only uploaded and published when all tests passed.
      - name: Upload report (passing runs only)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            playwright-console.log
          retention-days: 30

      - name: Upload console log (failed runs)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-console.log
          retention-days: 30

      - name: Upload report for GitHub Pages (passing runs only)
        if: success()
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report

  deploy-report:
    needs: test
    if: success() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
